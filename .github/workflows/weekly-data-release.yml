name: Weekly data release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone authoritative upstream
        run: git clone --depth 1 https://bitbucket.org/bluetooth-SIG/public.git "$RUNNER_TEMP/bluetooth-sig-public"

      - name: Generate latest offline catalog
        run: python3 Tools/generate_catalog.py --source-repo "$RUNNER_TEMP/bluetooth-sig-public"

      - name: Test generator and Swift package
        run: |
          python3 -m unittest discover Tools/tests
          swift test

      - name: Commit changed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/BluetoothAssignedNumbersKit/Data/bluetooth_assigned_numbers.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Bluetooth Assigned Numbers"
            git push origin HEAD:main
          fi

      - name: Publish weekly private data release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="data-$(date -u +%Y.%m.%d)"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" \
            Sources/BluetoothAssignedNumbersKit/Data/bluetooth_assigned_numbers.json \
            --title "$tag" \
            --notes "Private weekly offline snapshot generated from the Bluetooth SIG public Assigned Numbers repository."
